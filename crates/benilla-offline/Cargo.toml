[package]
name = "benilla-offline"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Offline TBC game launcher"
build = "build.rs"

[lints]
workspace = true

[features]
default = []
# Opt in locally to the profiler and developer tools; the normal offline build stays lean.
dev = ["benilla-app/dev"]
# Emit per-system spans to a Chrome trace when investigating a slow frame.
trace_chrome = ["benilla-app/trace_chrome"]

[dependencies]
benilla-app = { path = "../benilla-app", default-features = false, features = ["offline"] }

[build-dependencies]
benilla-buildstamp = { path = "../benilla-buildstamp" }

[[bin]]
name = "benilla-offline"
path = "src/main.rs"
test = false
